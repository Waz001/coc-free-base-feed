name: Free Base Feed

on:
  workflow_dispatch:

  # Once per day at 12:15 UTC
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

concurrency:
  group: free-base-feed
  cancel-in-progress: false

jobs:
  free-base-feed:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Download the repository so we can read/write state
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Check X accounts and send NEW base releases
      # --------------------------------------------------
      - name: Check X accounts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import html
          import urllib.request
          import urllib.parse
          import urllib.error
          from pathlib import Path


          # ==================================================
          # ACCOUNTS TO MONITOR
          #
          # Later, adding another builder is as simple as:
          #
          # {"username": "anotheraccount", "name": "Builder Name"}
          # ==================================================

          ACCOUNTS = [
              {
                  "username": "jagruk00",
                  "name": "JAGRUK"
              },
          ]


          TOKEN = os.environ["X_BEARER_TOKEN"]
          WEBHOOK = os.environ["DISCORD_WEBHOOK_URL"]

          STATE_DIR = Path("state")
          STATE_DIR.mkdir(exist_ok=True)


          # ==================================================
          # X API
          # ==================================================

          def x_get(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "MF-Buds-Free-Base-Feed"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  print()
                  print("X API ERROR:", error.code)

                  body = error.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print(body)

                  raise


          # ==================================================
          # DISCORD
          # ==================================================

          def send_discord(message):

              payload = {
                  "username": "Free Base Feed",

                  # 4 = SUPPRESS_EMBEDS
                  # Links remain clickable, but Discord does
                  # not generate the huge website previews.
                  "flags": 4,

                  "content": message
              }

              data = json.dumps(
                  payload
              ).encode("utf-8")

              request = urllib.request.Request(
                  WEBHOOK,
                  data=data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      print(
                          "Discord accepted message:",
                          response.status
                      )

              except urllib.error.HTTPError as error:

                  print()
                  print(
                      "DISCORD ERROR:",
                      error.code
                  )

                  body = error.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print(body)

                  raise


          # ==================================================
          # GET DIRECT CLASH LINKS FROM AN X POST
          # ==================================================

          def get_clash_links(tweet):

              links = []

              entities = tweet.get(
                  "entities",
                  {}
              )

              for item in entities.get(
                  "urls",
                  []
              ):

                  candidates = [
                      item.get("unwound_url", ""),
                      item.get("expanded_url", ""),
                      item.get("url", "")
                  ]

                  for candidate in candidates:

                      if (
                          candidate
                          and
                          "link.clashofclans.com" in candidate
                      ):

                          candidate = html.unescape(
                              candidate
                          )

                          if candidate not in links:
                              links.append(candidate)

                          break

              return links


          # ==================================================
          # REMOVE t.co LINKS FROM DISPLAY TEXT
          # ==================================================

          def clean_tweet_text(tweet):

              text = tweet.get(
                  "text",
                  ""
              )

              entities = tweet.get(
                  "entities",
                  {}
              )

              for item in entities.get(
                  "urls",
                  []
              ):

                  short_url = item.get(
                      "url",
                      ""
                  )

                  if short_url:
                      text = text.replace(
                          short_url,
                          ""
                      )

              # Remove excessive blank lines
              text = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  text
              )

              return text.strip()


          # ==================================================
          # BUILD CLEAN DISCORD MESSAGE
          # ==================================================

          def build_message(
              account,
              tweet,
              clash_links
          ):

              username = account["username"]
              display_name = account["name"]

              tweet_id = tweet["id"]

              cleaned_text = clean_tweet_text(
                  tweet
              )

              lines = [
                  line.strip()
                  for line in cleaned_text.splitlines()
                  if line.strip()
              ]


              message = (
                  f"🏰 **{display_name} Bases "
                  f"(@{username})**\n\n"
              )


              # ------------------------------------------------
              # Keep JAGRUK's own useful wording/base names.
              #
              # We don't reproduce t.co links because we're
              # replacing them with the direct Clash URLs.
              # ------------------------------------------------

              useful_lines = []

              for line in lines:

                  lower = line.lower()

                  # Remove promotional/repost lines
                  if "for more bases" in lower:
                      continue

                  if lower.startswith("repost"):
                      continue

                  if line == "💛":
                      continue

                  useful_lines.append(line)


              # ------------------------------------------------
              # The first useful line is normally the release
              # title, e.g. TH18 Global L1 Bases 🔥
              # ------------------------------------------------

              if useful_lines:

                  message += (
                      f"**{useful_lines[0]}**\n\n"
                  )

                  remaining_lines = useful_lines[1:]

              else:

                  remaining_lines = []


              # ------------------------------------------------
              # Try to match base names to Clash links.
              #
              # JAGRUK's posts normally contain:
              #
              # Drago
              # t.co link
              # Yatta
              # t.co link
              #
              # Once t.co links are removed, we're left with
              # the names in the correct order.
              # ------------------------------------------------

              names = []

              for line in remaining_lines:

                  if line.startswith("http"):
                      continue

                  if len(line) > 80:
                      continue

                  names.append(line)


              for index, clash_link in enumerate(
                  clash_links
              ):

                  if index < len(names):

                      message += (
                          f"**{names[index]}**\n"
                          f"{clash_link}\n\n"
                      )

                  else:

                      message += (
                          f"{clash_link}\n\n"
                      )


              # ------------------------------------------------
              # Original X post
              # ------------------------------------------------

              original_url = (
                  f"https://x.com/"
                  f"{username}/status/"
                  f"{tweet_id}"
              )

              message += (
                  "🔗 **Original X post:** "
                  f"{original_url}"
              )


              # Discord content limit is 2000 characters.
              # JAGRUK releases should normally be comfortably
              # below this, but protect against accidental
              # oversized messages.
              if len(message) > 1950:

                  message = (
                      f"🏰 **{display_name} Bases "
                      f"(@{username})**\n\n"
                  )

                  for clash_link in clash_links:

                      message += (
                          f"{clash_link}\n"
                      )

                  message += (
                      "\n🔗 **Original X post:** "
                      f"{original_url}"
                  )


              return message


          # ==================================================
          # PROCESS EACH ACCOUNT
          # ==================================================

          for account in ACCOUNTS:

              username = account["username"]

              print()
              print("=" * 60)
              print(
                  "Checking:",
                  "@" + username
              )
              print("=" * 60)


              state_file = (
                  STATE_DIR /
                  f"{username}.txt"
              )


              # ----------------------------------------------
              # Read last processed post ID
              # ----------------------------------------------

              if state_file.exists():

                  last_processed = (
                      state_file
                      .read_text()
                      .strip()
                  )

              else:

                  last_processed = ""


              if last_processed:

                  print(
                      "Last processed post:",
                      last_processed
                  )

              else:

                  print(
                      "No previous state found."
                  )


              # ----------------------------------------------
              # Look up account
              # ----------------------------------------------

              user_data = x_get(
                  "https://api.x.com/2/users/"
                  "by/username/"
                  + urllib.parse.quote(username)
              )

              user_id = user_data[
                  "data"
              ][
                  "id"
              ]


              # ----------------------------------------------
              # Get recent original posts
              # ----------------------------------------------

              result = x_get(
                  f"https://api.x.com/2/users/"
                  f"{user_id}/tweets"
                  "?max_results=10"
                  "&exclude=retweets,replies"
                  "&tweet.fields=created_at,entities"
              )


              tweets = result.get(
                  "data",
                  []
              )


              # API normally returns newest first.
              # We only want posts newer than our state.
              new_releases = []


              for tweet in tweets:

                  tweet_id = tweet["id"]


                  # ------------------------------------------
                  # Stop when we reach the post we've already
                  # processed on an earlier run.
                  # ------------------------------------------

                  if (
                      last_processed
                      and
                      tweet_id == last_processed
                  ):

                      break


                  clash_links = get_clash_links(
                      tweet
                  )


                  if clash_links:

                      new_releases.append(
                          (
                              tweet,
                              clash_links
                          )
                      )


              # ----------------------------------------------
              # FIRST EVER RUN
              #
              # Only post the newest qualifying release.
              # This prevents adding a new builder later and
              # dumping their entire recent history.
              # ----------------------------------------------

              if (
                  not last_processed
                  and
                  new_releases
              ):

                  new_releases = [
                      new_releases[0]
                  ]


              # ----------------------------------------------
              # Nothing new
              # ----------------------------------------------

              if not new_releases:

                  print(
                      "No new base releases."
                  )

                  # If this is the first run and no qualifying
                  # release exists, don't create state yet.

                  continue


              # ----------------------------------------------
              # Post oldest -> newest
              #
              # If multiple releases occurred since yesterday,
              # members see them chronologically.
              # ----------------------------------------------

              new_releases.reverse()


              newest_posted_id = None


              for (
                  tweet,
                  clash_links
              ) in new_releases:

                  print()
                  print(
                      "New release:",
                      tweet["id"]
                  )

                  print(
                      "Clash layouts:",
                      len(clash_links)
                  )


                  discord_message = build_message(
                      account,
                      tweet,
                      clash_links
                  )


                  send_discord(
                      discord_message
                  )


                  newest_posted_id = (
                      tweet["id"]
                  )


              # ----------------------------------------------
              # Save state ONLY after Discord succeeds.
              #
              # If Discord fails, we don't mark the release as
              # processed, so the next run can retry it.
              # ----------------------------------------------

              if newest_posted_id:

                  state_file.write_text(
                      newest_posted_id
                      + "\n"
                  )

                  print(
                      "Saved state:",
                      newest_posted_id
                  )


          print()
          print("All accounts checked.")

          PY


      # --------------------------------------------------
      # Save duplicate-protection state back to GitHub
      # --------------------------------------------------

      - name: Save feed state
        run: |
          if git status --porcelain state/ | grep -q .; then

            git config user.name "MF Buds Free Base Feed"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add state/

            git commit -m "Update free base feed state"

            git push

            echo "Feed state saved."

          else

            echo "No state changes to save."

          fi
