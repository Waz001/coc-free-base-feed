name: Test X API

on:
  workflow_dispatch:

jobs:
  test-x-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test JAGRUK via X API
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["X_BEARER_TOKEN"]

          def x_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "MF-Buds-Free-Base-Feed"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          # Step 1: Find JAGRUK's X user ID
          username = "jagruk00"

          user = x_get(
              "https://api.x.com/2/users/by/username/"
              + urllib.parse.quote(username)
          )

          print("SUCCESS: X API connection works")

          user_id = user["data"]["id"]
          print("Found account: @" + username)
          print("User ID: " + user_id)

          # Step 2: Retrieve recent posts
          posts = x_get(
              f"https://api.x.com/2/users/{user_id}/tweets"
              "?max_results=5"
              "&exclude=retweets,replies"
              "&tweet.fields=created_at,entities"
          )

          tweets = posts.get("data", [])

          print()
          print(f"Found {len(tweets)} recent posts")
          print("=" * 60)

          for tweet in tweets:
              print()
              print(tweet.get("created_at", ""))
              print(tweet.get("text", ""))

              entities = tweet.get("entities", {})
              urls = entities.get("urls", [])

              for item in urls:
                  expanded = item.get("expanded_url")
                  if expanded:
                      print("URL:", expanded)

              print("-" * 60)
          PY
